name: Auto Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml
        run: |
          node scripts/generate-pretty-routes.mjs
          node scripts/generate-article-share-pages.mjs
          node scripts/generate-sitemap.mjs

      - name: Commit and push if changed
        env:
          # "article" e "articoli" coprono anche i rispettivi index.html
          GENERATED_PATHS: >-
            sitemap.xml
            agenda/index.html
            agenda-detail/index.html
            archivio/index.html
            article
            articoli
            assets/social/article-og
            contatti/index.html
            countdown/index.html
            countdown-detail/index.html
            turni-ricreazione/index.html
            ricerca/index.html
            admin/index.html
            admin-article-editor/index.html
        run: |
          # git status e non git diff: le pagine dei nuovi articoli sono file untracked
          if [ -z "$(git status --porcelain -- $GENERATED_PATHS)" ]; then
            echo "No sitemap changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $GENERATED_PATHS
          git commit -m "chore: auto-update sitemap and pretty routes"
          git push
