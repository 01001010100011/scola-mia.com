<body class="min-h-screen bg-paper text-ink public-grid-bg">
  <script src="/assets/js/cookie-consent-bootstrap.js?v=20261006a"></script>
  <main class="min-h-screen flex flex-col items-center justify-center px-4 text-center">
    <h1 class="headline text-7xl md:text-8xl leading-none">Errore 404</h1>
    <a href="/" class="mt-6 border-2 border-black bg-accent text-white px-6 py-2.5 text-sm font-bold uppercase shadow-brutal">Torna alla Home</a>
  </main>
  <script>
    (function handlePrettyRouteRedirectFrom404() {
      try {
        const path = window.location.pathname;

        const legacyArticleMatch = path.match(/^\/articoli\/([^/]+)\/?$/);
        if (legacyArticleMatch) {
          const raw = decodeURIComponent(legacyArticleMatch[1] || "");
          // Rimuove l'eventuale prefisso UUID legacy (<uuid>-<slug>). La vecchia
          // verifica usava raw.split("-")[0] che non è mai un UUID completo,
          // quindi quel ramo non scattava: qui il match è sull'UUID intero.
          const uuidPrefix = raw.match(
            /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}-/
          );
          const slug = uuidPrefix ? raw.slice(uuidPrefix[0].length) : raw;
          // Pagina statica non ancora generata: passa al renderer dinamico.
          // article.js legge ?slug= e recupera l'articolo da Supabase, poi
          // riporta l'URL al canonico /articoli/<slug>/. È lo stesso pattern
          // usato sotto per countdown e agenda: rende ogni articolo appena
          // pubblicato subito accessibile, senza attendere la generazione CI.
          if (slug) {
            window.location.replace(`/article/?slug=${encodeURIComponent(slug)}`);
            return;
          }
        }

        const articleMatch = path.match(/^\/article\/([^/]+)\/?$/);
        if (articleMatch) {
          const slug = decodeURIComponent(articleMatch[1] || "");
          if (slug) {
            window.location.replace(`/articoli/${encodeURIComponent(slug)}/`);
            return;
          }
        }

        const countdownMatch = path.match(/^\/countdown\/([^/]+)\/?$/);
        if (countdownMatch) {
          const slug = decodeURIComponent(countdownMatch[1] || "");
          if (slug) {
            window.location.replace(`/countdown-detail/?id=${encodeURIComponent(slug)}`);
            return;
          }
        }

        const agendaMatch = path.match(/^\/agenda\/([^/]+)\/?$/);
        if (agendaMatch) {
          const slug = decodeURIComponent(agendaMatch[1] || "");
          if (slug) {
            window.location.replace(`/agenda-detail/?slug=${encodeURIComponent(slug)}`);
            return;
          }
        }
      } catch (_) {
        // no-op: keep regular 404 fallback
      }
    })();
  </script>
  <script src="/assets/js/cookie-consent-ui.js?v=20261006a"></script>
</body>
